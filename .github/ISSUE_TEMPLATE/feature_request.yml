name: 功能提案
description: 提議功能或相容性改進
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 描述目前工作流中遇到的限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議做法
      description: 說明你希望如何使用這項功能。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已嘗試的替代方法
    validations:
      required: false
